<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" role="img" aria-label="0x03 Recon">
<defs>
  
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#6e6a86"/>
    <stop offset="0.5" stop-color="#c4a7e7"/>
    <stop offset="1" stop-color="#6e6a86"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1260 0" dur="4.5s" repeatCount="indefinite"/>
  </linearGradient>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; white-space: pre; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
    .cur { animation: blink 1.1s infinite steps(1); }
    @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0} }
  </style>
</defs>
<rect width="1000" height="56" rx="10" fill="#191724"/>
<rect x="0.75" y="0.75" width="998.5" height="54.5" rx="10" fill="none" stroke="#c4a7e7" stroke-opacity="0.18"/>
<text x="500" y="33" text-anchor="middle" font-size="14"><tspan fill="url(#sweep)" >|=-------------------------------------=</tspan><tspan fill="#c4a7e7" >[ </tspan><tspan fill="#f6c177" font-weight="700">0x03</tspan><tspan fill="#9ccfd8" > :: </tspan><tspan fill="#c4a7e7" font-weight="700">Recon</tspan><tspan fill="#c4a7e7" > ]</tspan><tspan fill="url(#sweep)" >=--------------------------------------=|</tspan></text>
</svg>
